<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil · Cowork Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#2563eb', 'primary-light': '#3b82f6', accent: '#64748b', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="perfil" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
      <aside class="lg:col-span-1 space-y-5">
        <div class="bg-background-card border border-gray-800 rounded-2xl p-6 text-center">
          <img id="userAvatar" src="" alt="" class="h-24 w-24 rounded-full mx-auto border-4 border-primary/30 object-cover mb-4"/>
          <h2 id="userName" class="text-xl font-bold text-white" style="font-family: 'Playfair Display', serif;"></h2>
          <p id="userEmail" class="text-sm text-gray-400 mt-1"></p>
          <p id="userEmpresa" class="text-xs text-primary mt-2"></p>
          <div class="mt-5 pt-5 border-t border-gray-800 grid grid-cols-3 gap-2 text-center">
            <div>
              <p id="statTotal" class="text-2xl font-bold text-primary" style="font-family: 'Playfair Display', serif;">0</p>
              <p class="text-[10px] uppercase tracking-wider text-gray-400 mt-1">Reservas</p>
            </div>
            <div>
              <p id="statProximas" class="text-2xl font-bold text-white" style="font-family: 'Playfair Display', serif;">0</p>
              <p class="text-[10px] uppercase tracking-wider text-gray-400 mt-1">Próximas</p>
            </div>
            <div>
              <p id="statClases" class="text-2xl font-bold text-white" style="font-family: 'Playfair Display', serif;">0</p>
              <p class="text-[10px] uppercase tracking-wider text-gray-400 mt-1">Clases</p>
            </div>
          </div>
        </div>

        <div class="bg-background-card border border-gray-800 rounded-2xl p-5">
          <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-3">Accesos rápidos</h3>
          <nav class="space-y-1">
            <a href="reserva.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-primary/10 hover:text-primary transition-colors text-sm">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              Nueva reserva
            </a>
            <a href="horario-clases.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-primary/10 hover:text-primary transition-colors text-sm">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              Ver clases
            </a>
            <a href="precios.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-primary/10 hover:text-primary transition-colors text-sm">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14l.01.01M3 4h18v18H3V4z"></path></svg>
              Ver planes
            </a>
          </nav>
        </div>
      </aside>

      <div class="lg:col-span-2 space-y-6">
        <div class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-7">
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl font-bold text-white" style="font-family: 'Playfair Display', serif;">Datos personales</h2>
            <button id="btnEditProfile" class="text-sm text-primary hover:text-primary-light font-semibold">Editar</button>
          </div>
          <div id="perfilForm"></div>
        </div>

        <div class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-7">
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl font-bold text-white" style="font-family: 'Playfair Display', serif;">Cambiar contraseña</h2>
          </div>
          <form id="passwordForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="label-base">Contraseña actual</label>
                <input type="password" name="current" required class="input-base"/>
              </div>
              <div>
                <label class="label-base">Nueva contraseña</label>
                <input type="password" name="new" required minlength="6" class="input-base"/>
              </div>
              <div>
                <label class="label-base">Confirmar</label>
                <input type="password" name="new2" required minlength="6" class="input-base"/>
              </div>
            </div>
            <button type="submit" class="btn-primary">Cambiar contraseña</button>
          </form>
        </div>

        <div class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-7">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <div>
              <h2 class="text-xl font-bold text-white" style="font-family: 'Playfair Display', serif;">Historial de reservas</h2>
              <p class="text-sm text-gray-400 mt-1">Gestiona todas tus reservas</p>
            </div>
            <a href="reserva.html" class="btn-primary text-sm">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              Nueva reserva
            </a>
          </div>

          <div class="flex flex-wrap gap-2 mb-5">
            <button class="tab-btn active" data-filter="todas">Todas</button>
            <button class="tab-btn" data-filter="proximas">Próximas</button>
            <button class="tab-btn" data-filter="pendientes">Pendientes</button>
            <button class="tab-btn" data-filter="pasadas">Pasadas</button>
            <button class="tab-btn" data-filter="anuladas">Anuladas</button>
          </div>

          <div id="reservasContainer"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    let editing = false;
    let activeFilter = 'todas';

    function pageInit() {
      if (!Auth.isLogged()) { window.location.href = 'inicio-sesion.html'; return; }
      const user = Auth.current();
      renderUserHeader(user);
      renderPerfilForm(user);
      renderReservas();
      bindPasswordForm();
      bindEditButton();
      bindFilters();
    }

    function renderUserHeader(user) {
      document.getElementById('userAvatar').src = user.foto;
      document.getElementById('userName').textContent = user.nombre;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userEmpresa').textContent = user.empresa || 'Sin empresa asociada';

      const reservas = Reservas.listByUser(user.id);
      const proximas = reservas.filter(r => (UI.isFutureDate(r.fecha) || UI.isToday(r.fecha)) && r.estado !== 'anulada');
      let clases = 0;
      CLASES.forEach(c => { if (Clases.isInscrito(c.id, user.id)) clases++; });

      document.getElementById('statTotal').textContent = reservas.length;
      document.getElementById('statProximas').textContent = proximas.length;
      document.getElementById('statClases').textContent = clases;
    }

    function renderPerfilForm(user) {
      const c = document.getElementById('perfilForm');
      if (editing) {
        c.innerHTML = `
          <form id="profileForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="label-base">Nombre completo</label>
                <input type="text" name="nombre" required value="${user.nombre}" class="input-base"/>
              </div>
              <div>
                <label class="label-base">Empresa</label>
                <input type="text" name="empresa" value="${user.empresa || ''}" class="input-base"/>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="label-base">Email</label>
                <input type="email" name="email" required value="${user.email}" class="input-base"/>
              </div>
              <div>
                <label class="label-base">Teléfono</label>
                <input type="tel" name="telefono" value="${user.telefono || ''}" class="input-base"/>
              </div>
            </div>
            <div class="flex gap-3">
              <button type="submit" class="btn-primary">Guardar cambios</button>
              <button type="button" id="btnCancelEdit" class="btn-outline">Cancelar</button>
            </div>
          </form>`;
        document.getElementById('profileForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const result = Auth.update(user.id, {
            nombre: fd.get('nombre'),
            empresa: fd.get('empresa'),
            email: fd.get('email'),
            telefono: fd.get('telefono')
          });
          if (result.ok) {
            UI.toast('Perfil actualizado');
            editing = false;
            renderPerfilForm(result.user);
          } else {
            UI.toast('Error al guardar', 'error');
          }
        });
        document.getElementById('btnCancelEdit').addEventListener('click', () => {
          editing = false;
          renderPerfilForm(user);
        });
      } else {
        c.innerHTML = `
          <dl class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <dt class="text-xs text-primary uppercase tracking-wider mb-1">Nombre</dt>
              <dd class="text-white font-semibold">${user.nombre}</dd>
            </div>
            <div>
              <dt class="text-xs text-primary uppercase tracking-wider mb-1">Empresa</dt>
              <dd class="text-white font-semibold">${user.empresa || 'No especificada'}</dd>
            </div>
            <div>
              <dt class="text-xs text-primary uppercase tracking-wider mb-1">Email</dt>
              <dd class="text-white font-semibold break-all">${user.email}</dd>
            </div>
            <div>
              <dt class="text-xs text-primary uppercase tracking-wider mb-1">Teléfono</dt>
              <dd class="text-white font-semibold">${user.telefono || 'No especificado'}</dd>
            </div>
          </dl>`;
      }
    }

    function bindEditButton() {
      document.getElementById('btnEditProfile').addEventListener('click', () => {
        editing = !editing;
        renderPerfilForm(Auth.current());
      });
    }

    function bindPasswordForm() {
      document.getElementById('passwordForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const user = Auth.current();
        if (fd.get('new') !== fd.get('new2')) {
          UI.toast('Las contraseñas nuevas no coinciden', 'error');
          return;
        }
        const result = Auth.changePassword(user.id, fd.get('current'), fd.get('new'));
        if (result.ok) {
          UI.toast('Contraseña actualizada');
          e.target.reset();
        } else {
          UI.toast(result.error, 'error');
        }
      });
    }

    function bindFilters() {
      document.querySelectorAll('[data-filter]').forEach(b => {
        b.addEventListener('click', () => {
          activeFilter = b.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          renderReservas();
        });
      });
    }

    function renderReservas() {
      const user = Auth.current();
      let list = Reservas.listByUser(user.id);
      const now = new Date(); now.setHours(0,0,0,0);

      if (activeFilter === 'proximas') {
        list = list.filter(r => (UI.isFutureDate(r.fecha) || UI.isToday(r.fecha)) && r.estado !== 'anulada');
      } else if (activeFilter === 'pendientes') {
        list = list.filter(r => r.pago === 'pendiente' && r.estado !== 'anulada');
      } else if (activeFilter === 'pasadas') {
        list = list.filter(r => UI.isPastDate(r.fecha) && r.estado !== 'anulada');
      } else if (activeFilter === 'anuladas') {
        list = list.filter(r => r.estado === 'anulada');
      }

      list.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      const cont = document.getElementById('reservasContainer');
      if (list.length === 0) {
        cont.innerHTML = `
          <div class="text-center py-10">
            <svg class="h-12 w-12 text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <p class="text-gray-400 text-sm mb-4">No tienes reservas en esta categoría</p>
            <a href="reserva.html" class="btn-primary text-sm">Crear primera reserva</a>
          </div>`;
        return;
      }

      cont.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="border-b border-gray-800">
              <tr class="text-gray-400 uppercase text-xs tracking-wider">
                <th class="py-3 px-2 text-left">Servicio</th>
                <th class="py-3 px-2 text-left">Fecha</th>
                <th class="py-3 px-2 text-left">Hora</th>
                <th class="py-3 px-2 text-center">Estado</th>
                <th class="py-3 px-2 text-right">Monto</th>
                <th class="py-3 px-2 text-center">Acción</th>
              </tr>
            </thead>
            <tbody class="text-gray-300">
              ${list.map(r => {
                const serv = UI.servicioById(r.servicioId);
                const estado = UI.estadoBadge(r.estado);
                const pago = UI.pagoBadge(r.pago);
                return `
                  <tr class="border-b border-gray-800 hover:bg-primary/5 transition-colors">
                    <td class="py-3 px-2">
                      <p class="text-white font-semibold">${serv ? serv.nombre : '—'}</p>
                      <p class="text-[10px] text-primary uppercase">${serv ? UI.categoriaLabel(serv.categoria) : ''}</p>
                    </td>
                    <td class="py-3 px-2 text-gray-300">${UI.formatDateShort(r.fecha)}</td>
                    <td class="py-3 px-2 text-gray-300">${r.hora}</td>
                    <td class="py-3 px-2 text-center">
                      <span class="inline-block text-xs px-2 py-1 rounded-full border ${estado.cls}">${estado.label}</span>
                      ${r.pago === 'pendiente' && r.estado !== 'anulada' ? `<span class="inline-block text-xs px-2 py-1 rounded-full border mt-1 ${pago.cls}">${pago.label}</span>` : ''}
                    </td>
                    <td class="py-3 px-2 text-right text-primary font-semibold">${UI.formatPrice(r.precio)}</td>
                    <td class="py-3 px-2 text-center">
                      <a href="detalle-reserva.html?id=${r.id}" class="text-xs text-primary hover:text-primary-light font-semibold">Ver detalle →</a>
                    </td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }
  </script>
</body>
</html>
