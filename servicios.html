<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios · Cowork Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#2563eb', 'primary-light': '#3b82f6', accent: '#64748b', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="servicios" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main>
    <section class="py-20 border-b border-primary/10">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p class="text-primary uppercase tracking-[0.3em] text-xs mb-3 font-medium">Lo que ofrecemos</p>
        <h1 class="text-5xl md:text-6xl font-bold text-white mb-6" style="font-family: 'Playfair Display', serif;">Nuestros servicios</h1>
        <p class="text-gray-300 text-lg max-w-2xl mx-auto">Soluciones flexibles para freelancers, startups y empresas que buscan un espacio profesional.</p>
      </div>
    </section>

    <section class="py-12">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap gap-2 mb-8 justify-center" id="filtersContainer"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="serviciosGrid"></div>
      </div>
    </section>

    <section class="py-20">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-gradient-to-br from-primary/10 to-primary-dark/10 border border-primary/20 rounded-3xl p-8 md:p-12 text-center max-w-4xl mx-auto">
          <h2 class="text-3xl md:text-4xl font-bold text-white mb-4" style="font-family: 'Playfair Display', serif;">¿No encuentras lo que buscas?</h2>
          <p class="text-gray-300 mb-8 max-w-2xl mx-auto">Contáctanos y diseñamos un plan a la medida de tu empresa.</p>
          <a href="contacto.html" class="btn-primary">Contactar al equipo</a>
        </div>
      </div>
    </section>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    let activeFilter = 'all';
    function renderFilters() {
      const cats = [
        { id: 'all', label: 'Todos' },
        { id: 'hot-desk', label: 'Hot Desk' },
        { id: 'oficina', label: 'Oficinas' },
        { id: 'sala', label: 'Salas' },
        { id: 'evento', label: 'Eventos' },
        { id: 'virtual', label: 'Virtual' }
      ];
      document.getElementById('filtersContainer').innerHTML = cats.map(c =>
        `<button data-cat="${c.id}" class="tab-btn ${activeFilter === c.id ? 'active' : ''}">${c.label}</button>`
      ).join('');
      document.querySelectorAll('[data-cat]').forEach(b => {
        b.addEventListener('click', () => {
          activeFilter = b.dataset.cat;
          renderFilters();
          renderServicios();
        });
      });
    }

    function renderServicios() {
      const filtered = activeFilter === 'all' ? SERVICIOS : SERVICIOS.filter(s => s.categoria === activeFilter);
      const grid = document.getElementById('serviciosGrid');
      grid.innerHTML = filtered.map(s => `
        <div class="bg-background-card border border-gray-800 rounded-2xl overflow-hidden card-hover">
          <div class="aspect-[4/3] overflow-hidden relative">
            <img src="${s.imagen}" alt="${s.nombre}" class="w-full h-full object-cover"/>
            <div class="absolute top-3 left-3 bg-background-dark/80 backdrop-blur px-2 py-1 rounded text-xs text-primary font-semibold uppercase tracking-wider">${UI.categoriaLabel(s.categoria)}</div>
          </div>
          <div class="p-5">
            <h3 class="text-white font-bold text-lg mb-2" style="font-family: 'Playfair Display', serif;">${s.nombre}</h3>
            <p class="text-sm text-gray-400 mb-4">${s.descripcion}</p>
            <div class="flex items-center gap-3 text-xs text-gray-400 mb-4 pb-4 border-b border-gray-800">
              <span class="flex items-center gap-1">
                <svg class="h-4 w-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                ${s.capacidad} ${s.capacidad === 1 ? 'persona' : 'personas'}
              </span>
              <span class="flex items-center gap-1">
                <svg class="h-4 w-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                ${s.duracion < 1000 ? s.duracion + ' min' : 'Mensual'}
              </span>
            </div>
            <div class="flex items-center justify-between">
              <div>
                <p class="text-2xl font-bold text-primary" style="font-family: 'Playfair Display', serif;">${UI.formatPrice(s.precio)}</p>
                <p class="text-xs text-gray-500">por ${s.unidad}</p>
              </div>
              <a href="reserva.html?servicio=${s.id}" class="btn-primary text-sm">Reservar</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function pageInit() {
      renderFilters();
      renderServicios();
    }
  </script>
</body>
</html>
