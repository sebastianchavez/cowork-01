<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña · Cowork Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#2563eb', 'primary-light': '#3b82f6', accent: '#64748b', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="recuperar" class="bg-background-dark text-gray-200 font-sans min-h-screen flex flex-col">
  <header class="border-b border-primary/10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3">
          <svg class="h-9 w-9 text-primary" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="10" width="14" height="32" rx="2" fill="currentColor" opacity="0.3"/>
            <rect x="28" y="6" width="14" height="36" rx="2" fill="currentColor"/>
            <rect x="6" y="10" width="14" height="6" fill="currentColor"/>
            <rect x="28" y="6" width="14" height="6" fill="currentColor"/>
          </svg>
          <h2 class="text-lg font-bold text-white" style="font-family: 'Playfair Display', serif">Cowork Studio</h2>
        </a>
        <a href="inicio-sesion.html" class="text-sm text-gray-400 hover:text-primary">← Volver a login</a>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl bg-primary/10 border border-primary/30 mb-4">
          <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Recuperar contraseña</h1>
        <p class="text-gray-400 text-sm">Te ayudamos a recuperar el acceso a tu cuenta</p>
      </div>

      <div class="max-w-md mx-auto mb-8 flex items-center justify-between">
        <div class="flex flex-col items-center gap-1 flex-1">
          <div id="dot1" class="step-dot w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold bg-primary text-white border-2 border-primary">1</div>
          <span id="lbl1" class="text-xs text-primary">Email</span>
        </div>
        <div id="line1" class="step-line flex-1 mx-2"></div>
        <div class="flex flex-col items-center gap-1 flex-1">
          <div id="dot2" class="step-dot w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold bg-gray-800 text-gray-500 border-2 border-gray-700">2</div>
          <span id="lbl2" class="text-xs text-gray-500">Código</span>
        </div>
        <div id="line2" class="step-line flex-1 mx-2"></div>
        <div class="flex flex-col items-center gap-1 flex-1">
          <div id="dot3" class="step-dot w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold bg-gray-800 text-gray-500 border-2 border-gray-700">3</div>
          <span id="lbl3" class="text-xs text-gray-500">Nueva pass</span>
        </div>
      </div>

      <div id="stepContainer" class="bg-background-card border border-gray-800 rounded-2xl p-7"></div>

      <p class="text-center text-sm text-gray-400 mt-5">
        ¿Recordaste tu contraseña? <a href="inicio-sesion.html" class="text-primary font-semibold hover:text-primary-light">Ingresar</a>
      </p>
    </div>
  </main>

  <script src="main.js"></script>
  <script>
    let step = 1;
    let targetEmail = '';
    let codigoGenerado = '';

    function updateProgress() {
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById('dot' + i);
        const lbl = document.getElementById('lbl' + i);
        dot.classList.remove('bg-primary', 'text-white', 'bg-gray-800', 'text-gray-500', 'border-primary', 'border-gray-700');
        if (i <= step) {
          dot.classList.add('bg-primary', 'text-white', 'border-primary');
          lbl.classList.remove('text-gray-500'); lbl.classList.add('text-primary');
        } else {
          dot.classList.add('bg-gray-800', 'text-gray-500', 'border-gray-700');
          lbl.classList.remove('text-primary'); lbl.classList.add('text-gray-500');
        }
      }
      for (let i = 1; i <= 2; i++) {
        document.getElementById('line' + i).classList.toggle('active', i < step);
      }
    }

    function renderStep() {
      const cont = document.getElementById('stepContainer');
      if (step === 1) {
        cont.innerHTML = `
          <h2 class="text-xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Ingresa tu email</h2>
          <p class="text-sm text-gray-400 mb-5">Te enviaremos un código de verificación</p>
          <div id="errorMsg" class="hidden mb-4 bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300"></div>
          <form id="formStep1" class="space-y-4">
            <div>
              <label class="label-base">Email</label>
              <input type="email" name="email" required class="input-base" placeholder="tu@email.com"/>
            </div>
            <button type="submit" class="btn-primary w-full">Enviar código</button>
          </form>`;
        document.getElementById('formStep1').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const email = fd.get('email');
          const users = Storage.get(STORAGE_KEYS.USERS, []);
          const user = users.find(u => u.email === email);
          const errorEl = document.getElementById('errorMsg');
          if (!user) {
            errorEl.textContent = 'No existe una cuenta con ese email.';
            errorEl.classList.remove('hidden');
            return;
          }
          targetEmail = email;
          codigoGenerado = String(Math.floor(100000 + Math.random() * 900000));
          step = 2;
          updateProgress();
          renderStep();
          UI.toast('Código enviado: ' + codigoGenerado);
        });
      } else if (step === 2) {
        cont.innerHTML = `
          <h2 class="text-xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Verifica tu email</h2>
          <p class="text-sm text-gray-400 mb-1">Enviamos un código de 6 dígitos a <strong class="text-white">${targetEmail}</strong></p>
          <p class="text-xs text-yellow-400 mb-5 bg-yellow-500/10 border border-yellow-500/20 rounded p-2">Demo: tu código es <strong class="font-mono">${codigoGenerado}</strong></p>
          <div id="errorMsg" class="hidden mb-4 bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300"></div>
          <form id="formStep2" class="space-y-4">
            <div>
              <label class="label-base">Código de verificación</label>
              <input type="text" name="codigo" required maxlength="6" class="input-base text-center text-2xl tracking-widest font-mono" placeholder="000000"/>
            </div>
            <div class="flex gap-3">
              <button type="button" id="btnReenviar" class="btn-outline flex-1">Reenviar</button>
              <button type="submit" class="btn-primary flex-1">Verificar</button>
            </div>
          </form>`;
        document.getElementById('formStep2').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const codigo = fd.get('codigo');
          const errorEl = document.getElementById('errorMsg');
          if (codigo !== codigoGenerado) {
            errorEl.textContent = 'Código incorrecto. Intenta nuevamente.';
            errorEl.classList.remove('hidden');
            return;
          }
          step = 3;
          updateProgress();
          renderStep();
        });
        document.getElementById('btnReenviar').addEventListener('click', () => {
          codigoGenerado = String(Math.floor(100000 + Math.random() * 900000));
          UI.toast('Nuevo código: ' + codigoGenerado);
          renderStep();
        });
      } else if (step === 3) {
        cont.innerHTML = `
          <div class="checkmark-circle mx-auto mb-5">
            <div class="background"></div>
            <div class="checkmark"></div>
          </div>
          <h2 class="text-xl font-bold text-white mb-2 text-center" style="font-family: 'Playfair Display', serif;">Crea una nueva contraseña</h2>
          <p class="text-sm text-gray-400 mb-5 text-center">Elige una contraseña segura de al menos 6 caracteres</p>
          <div id="errorMsg" class="hidden mb-4 bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300"></div>
          <form id="formStep3" class="space-y-4">
            <div>
              <label class="label-base">Nueva contraseña</label>
              <input type="password" name="newpass" required minlength="6" class="input-base" placeholder="Mínimo 6 caracteres"/>
            </div>
            <div>
              <label class="label-base">Confirmar contraseña</label>
              <input type="password" name="newpass2" required minlength="6" class="input-base" placeholder="Repite tu contraseña"/>
            </div>
            <button type="submit" class="btn-primary w-full">Cambiar contraseña</button>
          </form>`;
        document.getElementById('formStep3').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const np = fd.get('newpass');
          const np2 = fd.get('newpass2');
          const errorEl = document.getElementById('errorMsg');
          if (np !== np2) {
            errorEl.textContent = 'Las contraseñas no coinciden.';
            errorEl.classList.remove('hidden');
            return;
          }
          const result = Auth.resetPasswordByEmail(targetEmail, np);
          if (result.ok) {
            UI.toast('¡Contraseña actualizada!');
            setTimeout(() => window.location.href = 'inicio-sesion.html', 800);
          } else {
            errorEl.textContent = result.error;
            errorEl.classList.remove('hidden');
          }
        });
      }
    }

    function pageInit() {
      updateProgress();
      renderStep();
    }
  </script>
</body>
</html>
