<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro · Cowork Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#2563eb', 'primary-light': '#3b82f6', accent: '#64748b', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="registro" class="bg-background-dark text-gray-200 font-sans min-h-screen flex flex-col">
  <header class="border-b border-primary/10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3">
          <svg class="h-9 w-9 text-primary" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="10" width="14" height="32" rx="2" fill="currentColor" opacity="0.3"/>
            <rect x="28" y="6" width="14" height="36" rx="2" fill="currentColor"/>
            <rect x="6" y="10" width="14" height="6" fill="currentColor"/>
            <rect x="28" y="6" width="14" height="6" fill="currentColor"/>
          </svg>
          <h2 class="text-lg font-bold text-white" style="font-family: 'Playfair Display', serif">Cowork Studio</h2>
        </a>
        <a href="index.html" class="text-sm text-gray-400 hover:text-primary">← Volver al inicio</a>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-lg">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl bg-primary/10 border border-primary/30 mb-4">
          <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Crear cuenta</h1>
        <p class="text-gray-400 text-sm">Únete a la comunidad Cowork Studio</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-7">
        <div id="errorMsg" class="hidden mb-4 bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300"></div>
        <form id="registerForm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="label-base">Nombre completo</label>
              <input type="text" name="nombre" required class="input-base" placeholder="Tu nombre"/>
            </div>
            <div>
              <label class="label-base">Empresa (opcional)</label>
              <input type="text" name="empresa" class="input-base" placeholder="Nombre de tu empresa"/>
            </div>
          </div>
          <div>
            <label class="label-base">Email</label>
            <input type="email" name="email" required class="input-base" placeholder="tu@email.com" autocomplete="email"/>
          </div>
          <div>
            <label class="label-base">Teléfono (opcional)</label>
            <input type="tel" name="telefono" class="input-base" placeholder="+56 9 0000 0000"/>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="label-base">Contraseña</label>
              <input type="password" name="password" id="password" required minlength="6" class="input-base" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>
            </div>
            <div>
              <label class="label-base">Confirmar contraseña</label>
              <input type="password" name="password2" required minlength="6" class="input-base" placeholder="Repite tu contraseña" autocomplete="new-password"/>
            </div>
          </div>
          <div class="flex items-start gap-2">
            <input type="checkbox" id="aceptaTerminos" name="aceptaTerminos" required class="mt-1 rounded border-gray-500 text-primary focus:ring-primary"/>
            <label for="aceptaTerminos" class="text-sm text-gray-400">Acepto los <a href="terminos.html" target="_blank" class="text-primary hover:underline">Términos y Condiciones</a> y la <a href="privacidad.html" target="_blank" class="text-primary hover:underline">Política de Privacidad</a></label>
          </div>
          <button type="submit" class="btn-primary w-full">Crear cuenta</button>
        </form>

        <p class="text-center text-sm text-gray-400 mt-6">
          ¿Ya tienes cuenta? <a href="inicio-sesion.html" class="text-primary font-semibold hover:text-primary-light">Ingresar</a>
        </p>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script>
    function pageInit() {
      if (Auth.isLogged()) { window.location.href = 'perfil.html'; return; }
      const form = document.getElementById('registerForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const password = fd.get('password');
        const password2 = fd.get('password2');
        const errorEl = document.getElementById('errorMsg');

        if (password !== password2) {
          errorEl.textContent = 'Las contraseñas no coinciden.';
          errorEl.classList.remove('hidden');
          return;
        }

        const result = Auth.register({
          nombre: fd.get('nombre'),
          empresa: fd.get('empresa'),
          email: fd.get('email'),
          telefono: fd.get('telefono'),
          password: password,
          aceptaTerminos: fd.get('aceptaTerminos') === 'on'
        });

        if (result.ok) {
          Auth.login(fd.get('email'), password);
          UI.toast('¡Bienvenido a Cowork Studio!');
          setTimeout(() => window.location.href = 'perfil.html', 700);
        } else {
          errorEl.textContent = result.error;
          errorEl.classList.remove('hidden');
        }
      });
    }
  </script>
</body>
</html>
