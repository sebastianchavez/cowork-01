<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión · Cowork Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#2563eb', 'primary-light': '#3b82f6', accent: '#64748b', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="login" class="bg-background-dark text-gray-200 font-sans min-h-screen flex flex-col">
  <header class="border-b border-primary/10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3">
          <svg class="h-9 w-9 text-primary" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="10" width="14" height="32" rx="2" fill="currentColor" opacity="0.3"/>
            <rect x="28" y="6" width="14" height="36" rx="2" fill="currentColor"/>
            <rect x="6" y="10" width="14" height="6" fill="currentColor"/>
            <rect x="28" y="6" width="14" height="6" fill="currentColor"/>
          </svg>
          <h2 class="text-lg font-bold text-white" style="font-family: 'Playfair Display', serif">Cowork Studio</h2>
        </a>
        <a href="index.html" class="text-sm text-gray-400 hover:text-primary">← Volver al inicio</a>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl bg-primary/10 border border-primary/30 mb-4">
          <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Bienvenido de vuelta</h1>
        <p class="text-gray-400 text-sm">Ingresa a tu cuenta para gestionar tus espacios</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-7">
        <div id="errorMsg" class="hidden mb-4 bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300"></div>
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="label-base">Email</label>
            <input type="email" name="email" required class="input-base" placeholder="tu@email.com" autocomplete="email"/>
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="label-base mb-0">Contraseña</label>
              <a href="recuperar-password.html" class="text-xs text-primary hover:text-primary-light">¿Olvidaste?</a>
            </div>
            <input type="password" name="password" required class="input-base" placeholder="••••••••" autocomplete="current-password"/>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="remember" class="rounded border-gray-500 text-primary focus:ring-primary"/>
            <label for="remember" class="text-sm text-gray-400">Recordar sesión</label>
          </div>
          <button type="submit" class="btn-primary w-full">Iniciar sesión</button>
        </form>

        <div class="my-5 flex items-center gap-3 text-xs text-gray-500">
          <div class="flex-1 h-px bg-gray-800"></div>
          <span>o continúa con</span>
          <div class="flex-1 h-px bg-gray-800"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button class="btn-outline text-sm" type="button">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M22.675 0H1.325C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.22v-3.622h3.6V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.593 1.323-1.325V1.325C24 .593 23.407 0 22.675 0z"/></svg>
            Facebook
          </button>
          <button class="btn-outline text-sm" type="button">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 8.47 3.59 14.07l3.85 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
        </div>

        <p class="text-center text-sm text-gray-400 mt-6">
          ¿No tienes cuenta? <a href="registro.html" class="text-primary font-semibold hover:text-primary-light">Regístrate</a>
        </p>
      </div>

      <div class="mt-5 bg-background-card/50 border border-primary/20 rounded-xl p-4 text-xs text-gray-400">
        <p class="font-semibold text-primary mb-1">Cuentas de prueba:</p>
        <p><strong>felipe@test.com</strong> / 123456</p>
        <p><strong>constanza@test.com</strong> / 123456</p>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script>
    function pageInit() {
      if (Auth.isLogged()) { window.location.href = 'perfil.html'; return; }
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const result = Auth.login(fd.get('email'), fd.get('password'));
        if (result.ok) {
          UI.toast('Bienvenido ' + result.user.nombre.split(' ')[0]);
          const redirect = Storage.get('cw_redirect') || 'perfil.html';
          Storage.remove('cw_redirect');
          setTimeout(() => window.location.href = redirect, 600);
        } else {
          const errorEl = document.getElementById('errorMsg');
          errorEl.textContent = result.error;
          errorEl.classList.remove('hidden');
        }
      });
    }
  </script>
</body>
</html>
