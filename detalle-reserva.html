<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Reserva · Cowork Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#2563eb', 'primary-light': '#3b82f6', accent: '#64748b', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="detalle-reserva" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="max-w-4xl mx-auto">
      <a href="perfil.html" class="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-primary mb-5">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Volver a mis reservas
      </a>

      <div id="detalleContainer"></div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="main.js"></script>
  <script>
    let currentReserva = null;

    function pageInit() {
      if (!Auth.isLogged()) { window.location.href = 'inicio-sesion.html'; return; }
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { window.location.href = 'perfil.html'; return; }

      const r = Reservas.get(id);
      const user = Auth.current();
      if (!r || r.userId !== user.id) {
        UI.toast('Reserva no encontrada', 'error');
        setTimeout(() => window.location.href = 'perfil.html', 800);
        return;
      }
      currentReserva = r;
      renderDetalle();
    }

    function renderDetalle() {
      const r = currentReserva;
      const serv = UI.servicioById(r.servicioId);
      const esp = r.espacioId ? UI.espacioById(r.espacioId) : null;
      const metodo = r.metodoPago ? METODOS_PAGO.find(m => m.id === r.metodoPago) : null;
      const estado = UI.estadoBadge(r.estado);
      const pago = UI.pagoBadge(r.pago);

      const isPast = UI.isPastDate(r.fecha);
      const canCancel = r.estado !== 'anulada' && !isPast;
      const canPay = r.estado !== 'anulada' && r.pago === 'pendiente';

      document.getElementById('detalleContainer').innerHTML = `
        <div class="bg-background-card border border-gray-800 rounded-2xl overflow-hidden">
          <div class="relative h-48 bg-gradient-to-br from-primary/30 to-primary-dark/30 flex items-center justify-center">
            <img src="${serv.imagen}" alt="${serv.nombre}" class="w-full h-full object-cover opacity-40"/>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
              <span class="inline-block text-xs px-3 py-1 rounded-full border ${estado.cls} mb-3">${estado.label}</span>
              <h1 class="text-2xl md:text-3xl font-bold text-white" style="font-family: 'Playfair Display', serif;">${serv.nombre}</h1>
              <p class="text-sm text-white/80 mt-2 font-mono">${r.id.toUpperCase()}</p>
            </div>
          </div>

          <div class="p-6 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
              <div class="bg-background-dark/50 rounded-xl p-5">
                <p class="text-xs text-primary uppercase tracking-wider mb-2">Fecha y hora</p>
                <p class="text-white font-bold text-lg">${UI.formatDate(r.fecha)}</p>
                <p class="text-primary font-semibold mt-1">${r.hora}</p>
              </div>
              <div class="bg-background-dark/50 rounded-xl p-5">
                <p class="text-xs text-primary uppercase tracking-wider mb-2">Duración</p>
                <p class="text-white font-bold text-lg">${serv.unidad}</p>
                <p class="text-gray-400 text-sm mt-1">${serv.duracion < 1000 ? serv.duracion + ' minutos' : 'Acceso mensual'}</p>
              </div>
            </div>

            ${esp ? `
            <div class="bg-background-dark/50 rounded-xl p-5 mb-6">
              <p class="text-xs text-primary uppercase tracking-wider mb-3">Espacio reservado</p>
              <div class="flex items-center gap-4">
                <img src="${esp.imagen}" alt="${esp.nombre}" class="h-16 w-16 rounded-lg object-cover"/>
                <div class="flex-1">
                  <p class="text-white font-bold">${esp.nombre}</p>
                  <p class="text-sm text-gray-400">${esp.descripcion}</p>
                  <p class="text-xs text-primary mt-1">Capacidad: ${esp.capacidad} personas · ★ ${esp.rating}</p>
                </div>
              </div>
            </div>` : ''}

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
              <div class="bg-background-dark/50 rounded-xl p-4 text-center">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Servicio</p>
                <p class="text-white font-bold text-sm">${UI.categoriaLabel(serv.categoria)}</p>
              </div>
              <div class="bg-background-dark/50 rounded-xl p-4 text-center">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Estado pago</p>
                <span class="inline-block text-xs px-2 py-1 rounded-full border ${pago.cls}">${pago.label}</span>
              </div>
              <div class="bg-background-dark/50 rounded-xl p-4 text-center">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Método</p>
                <p class="text-white font-bold text-sm">${metodo ? metodo.nombre : '—'}</p>
              </div>
            </div>

            <div class="bg-primary/5 border border-primary/30 rounded-xl p-5 mb-6">
              <div class="flex justify-between items-center">
                <div>
                  <p class="text-xs text-primary uppercase tracking-wider">Total reserva</p>
                  <p class="text-3xl font-bold text-primary mt-1" style="font-family: 'Playfair Display', serif;">${UI.formatPrice(r.precio)}</p>
                </div>
                <div class="text-right text-xs text-gray-400">
                  <p>Creada: ${new Date(r.createdAt).toLocaleDateString('es-CL')}</p>
                  ${metodo ? `<p>Pago: ${new Date(r.createdAt).toLocaleDateString('es-CL')}</p>` : ''}
                </div>
              </div>
            </div>

            <div class="flex flex-wrap gap-3 pt-5 border-t border-gray-800">
              <a href="perfil.html" class="btn-outline">← Volver</a>
              ${canPay ? `
                <button id="btnPay" class="btn-primary">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                  Pagar ahora
                </button>
              ` : ''}
              ${canCancel ? `
                <button id="btnCancel" class="btn-danger ml-auto">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"></path></svg>
                  Anular reserva
                </button>
              ` : ''}
            </div>

            ${r.estado === 'anulada' ? `
            <div class="mt-5 bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex gap-3">
              <svg class="h-6 w-6 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <div>
                <p class="text-red-300 font-semibold text-sm">Esta reserva fue anulada</p>
                <p class="text-red-400/70 text-xs mt-1">Si pagaste por esta reserva, contáctanos para gestionar un reembolso.</p>
              </div>
            </div>` : ''}

            ${isPast && r.estado !== 'anulada' ? `
            <div class="mt-5 bg-gray-500/10 border border-gray-500/30 rounded-xl p-4 flex gap-3">
              <svg class="h-6 w-6 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <div>
                <p class="text-gray-300 font-semibold text-sm">Esta reserva ya pasó</p>
                <p class="text-gray-400/70 text-xs mt-1">No es posible anular reservas de fechas pasadas.</p>
              </div>
            </div>` : ''}
          </div>
        </div>`;

      const btnCancel = document.getElementById('btnCancel');
      if (btnCancel) {
        btnCancel.addEventListener('click', () => {
          UI.modal(`
            <h3 class="text-xl font-bold text-white mb-3" style="font-family: 'Playfair Display', serif;">¿Anular esta reserva?</h3>
            <p class="text-gray-300 mb-2">Estás a punto de anular la siguiente reserva:</p>
            <div class="bg-background-dark/50 rounded-lg p-4 mb-5">
              <p class="text-white font-semibold">${serv.nombre}</p>
              <p class="text-sm text-gray-400">${UI.formatDateShort(r.fecha)} · ${r.hora}</p>
              <p class="text-primary font-bold mt-2">${UI.formatPrice(r.precio)}</p>
            </div>
            <p class="text-xs text-yellow-300 mb-5 bg-yellow-500/10 border border-yellow-500/30 rounded p-3">
              <strong>Importante:</strong> Esta acción no se puede deshacer. Si pagaste por esta reserva, deberás solicitar un reembolso por separado.
            </p>
            <div class="flex gap-3">
              <button class="flex-1 btn-outline" data-close>No, mantener</button>
              <button class="flex-1 btn-danger" data-confirm>Sí, anular</button>
            </div>
          `, {
            onConfirm: () => {
              Reservas.cancel(r.id);
              UI.toast('Reserva anulada');
              setTimeout(() => window.location.reload(), 600);
            }
          });
        });
      }

      const btnPay = document.getElementById('btnPay');
      if (btnPay) {
        btnPay.addEventListener('click', () => {
          Storage.set(STORAGE_KEYS.RESERVA_ACTUAL, r.id);
          window.location.href = 'pago.html';
        });
      }
    }
  </script>
</body>
</html>
